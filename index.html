<body>
<div class="wrap">
  <header id="hdr"></header>
  <main id="view"></main>
  <footer class="foot">P2P auction — bids travel directly between browsers ⚽</footer>
</div>

<script type="module">
/* ============================================================
   ⚽ LATENCY AUCTION — P2P EDITION (fixed)
   ============================================================ */

const CURRENCY = '₹';
const LS_UID = 'la_uid', LS_NAME = 'la_name', LS_SOUND = 'la_sound', LS_LAST = 'la_last_room';

/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const rnd = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => CURRENCY + (Number(n) || 0);
const clamp = (v, a, b) => Math.min(b, Math.max(a, Number(v) || 0));
const CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const genCode = () => Array.from({length:5}, () => CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
const roomLink = code => location.origin + location.pathname + '?room=' + code;

/* ---------- sound ---------- */
let AC = null;
function ac(){
  if(!AC){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return null; AC = new C(); }
  if(AC.state === 'suspended') AC.resume();
  return AC;
}
function unlockAudio(){ try{ ac(); }catch(e){} }
function tone(freq, dur, type, vol, delay){
  dur = dur || .12; type = type || 'sine'; vol = vol || .12; delay = delay || 0;
  if(!app.sound) return;
  const c = ac(); if(!c) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.04);
}
const SFX = {
  click(){ tone(620, .06, 'triangle', .07); },
  bid(){ tone(760, .07, 'square', .07); tone(1140, .09, 'square', .06, .07); },
  sold(){ [523,659,784,1046].forEach((f,i) => tone(f, .18, 'sine', .11, i*.085)); },
  unsold(){ tone(320, .14, 'sawtooth', .06); tone(220, .22, 'sawtooth', .06, .13); },
  join(){ tone(880, .07, 'sine', .09); tone(1174, .1, 'sine', .09, .07); },
  error(){ tone(180, .2, 'square', .09); },
  kick(){ tone(150, .09, 'triangle', .14); },
  whistle(){ tone(1900, .09, 'sine', .08); tone(1900, .13, 'sine', .08, .13); }
};

/* ============================================================
   STORE — P2P with local fallback
   ============================================================ */
const Store = {
  mode: 'local',       // 'p2p' | 'local'
  isHost: false,
  code: null,
  onState: null,
  _hostData: null,
  _sendState: null,
  _sendAction: null,
  _roomApi: null,
  _joinRoomFn: null,
  _bc: (typeof BroadcastChannel !== 'undefined') ? new BroadcastChannel('latency-auction') : null,

  async loadP2P(){
    if(this._joinRoomFn) return this._joinRoomFn;
    const urls = [
      'https://esm.sh/trystero@0.21.6',
      'https://esm.sh/trystero',
      'https://cdn.jsdelivr.net/npm/trystero@0.21.6/+esm',
      'https://unpkg.com/trystero@0.21.6/+esm'
    ];
    for(const url of urls){
      try{
        const mod = await import(url);
        if(mod && typeof mod.joinRoom === 'function'){
          this._joinRoomFn = mod.joinRoom;
          return mod.joinRoom;
        }
      }catch(e){ console.warn('CDN failed:', url, e); }
    }
    console.warn('All P2P CDNs failed — falling back to local mode');
    return null;
  },

  async connect(code, isHost, initialState){
    this.code = code;
    this.isHost = isHost;

    if(isHost){
      this._hostData = initialState;
    }

    /* always set up local broadcast for same-device fallback */
    if(this._bc){
      this._bc.onmessage = (e) => {
        const d = e.data;
        if(d && d.type === 'state' && d.code === this.code && !this.isHost){
          this._receiveState(d.data);
        }
        if(d && d.type === 'action' && d.code === this.code && this.isHost){
          this._applyAction(d.data);
        }
      };
    }

    /* try to load P2P */
    const joinFn = await this.loadP2P();
    if(joinFn){
      try{
        const room = joinFn({ appId: 'latency-auction-v1' }, code);
        this._roomApi = room;

        const statePair = room.makeAction('state');
        const actionPair = room.makeAction('action');
        this._sendState = statePair[0];
        this._sendAction = actionPair[0];
        const getState = statePair[1];
        const getAction = actionPair[1];

        getState((data) => {
          if(this.isHost) return;
          this._receiveState(data);
        });
        getAction((action) => {
          if(!this.isHost) return;
          this._applyAction(action);
        });
        room.onPeerJoin(() => {
          if(this.isHost && this._hostData){
            try{ this._sendState(this._hostData); }catch(e){}
          }
        });

        this.mode = 'p2p';
      }catch(e){
        console.warn('P2P setup failed:', e);
        this.mode = 'local';
      }
    }else{
      this.mode = 'local';
    }

    /* if host, push state immediately */
    if(this.isHost){
      this._broadcast();
    }
  },

  _receiveState(data){
    if(!data) return;
    if(this.onState) this.onState(data);
  },

  _broadcast(){
    if(!this.isHost || !this._hostData) return;
    const snapshot = JSON.parse(JSON.stringify(this._hostData));

    /* P2P broadcast */
    if(this._sendState){
      try{ this._sendState(snapshot); }catch(e){}
    }
    /* local broadcast */
    if(this._bc){
      try{ this._bc.postMessage({ type:'state', code:this.code, data:snapshot }); }catch(e){}
    }
    /* also notify self */
    if(this.onState) this.onState(snapshot);
  },

  sendAction(action){
    /* P2P */
    if(this._sendAction){
      try{ this._sendAction(action); return; }catch(e){}
    }
    /* local */
    if(this._bc){
      try{ this._bc.postMessage({ type:'action', code:this.code, data:action }); }catch(e){}
    }
  },

  _applyAction(action){
    if(!this.isHost || !this._hostData || !action) return;
    const r = this._hostData;

    if(action.type === 'join'){
      const m = r.members[action.uid];
      if(!m){
        r.members[action.uid] = {
          id: action.uid, name: action.name, role: action.role,
          status: action.role === 'observer' ? 'pending' : 'approved',
          joinedAt: Date.now()
        };
      }else{
        m.name = action.name;
        if(m.status === 'kicked'){
          m.role = action.role;
          m.status = 'pending';
        }else if(action.role === 'observer' && m.status === 'approved'){
          m.role = 'observer';
          m.status = 'pending';
        }else if(action.role === 'bidder'){
          m.role = 'bidder';
          m.status = 'approved';
        }
      }
      this._broadcast();
      return;
    }

    if(action.type === 'bid'){
      if(r.status !== 'auction') return;
      const p = r.players[r.current];
      if(!p || p.status !== 'wait') return;
      const me = r.members[action.uid];
      if(!me || me.status !== 'approved' || me.role === 'observer') return;
      const next = r.bid ? r.bid + r.increment : p.base;
      const spent = (r.results[action.uid] && r.results[action.uid].spent) || 0;
      if(r.budget > 0 && spent + next > r.budget) return;
      if(r.highBidder === action.uid) return;

      r.bid = next;
      r.highBidder = action.uid;
      r.highBidderName = me.name;
      r.timerEnd = Date.now() + r.timer * 1000;
      this._broadcast();
    }
  },

  destroy(){
    if(this._roomApi){ try{ this._roomApi.leave(); }catch(e){} }
    this._roomApi = null;
    this._sendState = null;
    this._sendAction = null;
    this._hostData = null;
    this.onState = null;
    this.mode = 'local';
  }
};

/* ---------- app state ---------- */
const app = {
  uid: '', name: '', sound: true,
  screen: 'home',
  room: null, code: null, isHost: false,
  draft: { name: '', base: '10' },
  roomName: '', increment: '5', budget: '100', timer: '15',
  joinCode: '', joinRole: 'bidder',
  showQR: false, lastBid: 0
};
let prevRoom = null;

/* ---------- helpers ---------- */
let toastT;
function toast(msg){
  let el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastT);
  toastT = setTimeout(() => el.classList.remove('show'), 2300);
}

function confetti(){
  const emojis = ['⚽','🎉','✨','🏆','🥳','💚','🌟'];
  for(let i = 0; i < 18; i++){
    const d = document.createElement('div');
    d.className = 'confetti';
    d.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    d.style.left = (Math.random()*100) + 'vw';
    d.style.animationDelay = (Math.random()*0.35) + 's';
    d.style.fontSize = (15 + Math.random()*20) + 'px';
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 2700);
  }
}

function buildDeco(){
  const spots = [[6,14],[88,10],[4,62],[92,52],[10,86],[86,84],[48,4]];
  const chars = ['⚽','🏆','🥅','🎽','⚽','🏟️','⭐'];
  spots.forEach((s, i) => {
    const d = document.createElement('div');
    d.className = 'deco';
    d.textContent = chars[i];
    d.style.left = s[0] + 'vw';
    d.style.top = s[1] + 'vh';
    d.style.animationDelay = (i*0.7) + 's';
    document.body.appendChild(d);
  });
}

function setModel(path, value){
  if(path.indexOf('.') === -1){ app[path] = value; return; }
  const parts = path.split('.');
  if(!app[parts[0]]) app[parts[0]] = {};
  app[parts[0]][parts[1]] = value;
}

/* ---------- room model ---------- */
function newRoom(o){
  return {
    code: o.code, name: o.name, hostId: o.hostId, hostName: o.hostName,
    createdAt: Date.now(), status: 'lobby',
    increment: clamp(o.increment, 1, 1000),
    budget: clamp(o.budget, 0, 1000000),
    timer: clamp(o.timer, 5, 120),
    members: {}, players: [], current: -1,
    bid: 0, highBidder: null, highBidderName: '',
    timerEnd: 0, results: {}, log: [], round: 1
  };
}

function finalizePlayer(room){
  const p = room.players[room.current];
  if(!p || p.status !== 'wait') return;
  if(room.highBidder){
    p.status = 'sold';
    p.soldTo = room.highBidder;
    p.soldToName = room.highBidderName;
    p.price = room.bid;
    const res = room.results[room.highBidder] || (room.results[room.highBidder] = { spent: 0, players: [] });
    res.spent = (res.spent || 0) + room.bid;
    if(!res.players) res.players = [];
    res.players.push({ name: p.name, price: room.bid });
    room.log.unshift({ t: Date.now(), text: '✅ ' + p.name + ' SOLD to ' + p.soldToName + ' for ' + fmt(room.bid) });
  }else{
    p.status = 'unsold';
    room.log.unshift({ t: Date.now(), text: '❌ ' + p.name + ' went UNSOLD' });
  }
  room.log = room.log.slice(0, 30);
  room.timerEnd = 0;
}

function openPlayer(room){
  const p = room.players[room.current];
  if(!p) return;
  room.bid = 0;
  room.highBidder = null;
  room.highBidderName = '';
  room.timerEnd = Date.now() + room.timer*1000;
  room.log.unshift({ t: Date.now(), text: '🔔 ' + p.name + ' is up — base ' + fmt(p.base) });
  room.log = room.log.slice(0, 30);
}

function nextPlayer(room){
  let idx = -1;
  for(let i = room.current + 1; i < room.players.length; i++){
    if(room.players[i].status === 'wait'){ idx = i; break; }
  }
  if(idx === -1) idx = room.players.findIndex(p => p.status === 'wait');
  if(idx === -1){
    room.status = 'finished'; room.current = -1; room.timerEnd = 0;
    room.log.unshift({ t: Date.now(), text: '🏁 Auction complete!' });
    return;
  }
  room.current = idx;
  openPlayer(room);
}

/* ---------- change watcher ---------- */
function handleUpdate(room){
  if(prevRoom && room){
    if((room.bid || 0) > (prevRoom.bid || 0)) SFX.bid();
    const wasDone = prevRoom.players.filter(p => p.status !== 'wait').length;
    const nowDone = room.players.filter(p => p.status !== 'wait').length;
    if(nowDone > wasDone){
      const done = room.players.find(p => p.status !== 'wait' && !prevRoom.players.find(q => q.id === p.id && q.status !== 'wait'));
      if(done && done.status === 'sold'){ SFX.sold(); confetti(); }
      else if(done){ SFX.unsold(); }
    }
    if(Object.keys(room.members).length > Object.keys(prevRoom.members).length) SFX.join();
    if(room.status === 'finished' && prevRoom.status !== 'finished'){ SFX.sold(); confetti(); }
  }
  prevRoom = room ? JSON.parse(JSON.stringify(room)) : null;
}

/* ---------- enter room (render FIRST, then connect) ---------- */
async function enterRoom(code, isHost, initialState){
  /* 1. Set state immediately so UI renders no matter what */
  app.code = code;
  app.isHost = isHost;
  app.room = initialState;
  prevRoom = JSON.parse(JSON.stringify(initialState));

  /* 2. Wire up the state callback BEFORE connecting */
  Store.onState = (room) => {
    handleUpdate(room);
    app.room = room;
    render();
  };

  /* 3. Update URL + render RIGHT NOW */
  try{ history.replaceState(null, '', '?room=' + code); }catch(e){}
  try{ localStorage.setItem(LS_LAST, code); }catch(e){}
  render();

  /* 4. Now try to connect P2P in the background */
  try{
    await Store.connect(code, isHost, initialState);
    return Store.mode;
  }catch(e){
    console.warn('Connect failed:', e);
    return 'local';
  }
}

/* ---------- timer + host tick ---------- */
function updateTimerUI(){
  const r = app.room;
  if(!r || r.status !== 'auction' || !r.timerEnd) return;
  const left = r.timerEnd - Date.now();
  const secs = Math.max(0, Math.ceil(left / 1000));
  const t = document.getElementById('timer-secs');
  if(t) t.textContent = secs;
  const bar = document.getElementById('timer-bar');
  if(bar) bar.style.width = Math.max(0, Math.min(100, (left / (r.timer*1000)) * 100)) + '%';
  const pill = document.getElementById('timer-pill');
  if(pill) pill.classList.toggle('urgent', secs <= 5 && secs > 0);
}

let ticking = false;
function hostTick(){
  if(!app.isHost || !app.room || !Store._hostData) return;
  const r = Store._hostData;
  if(r.status !== 'auction' || !r.timerEnd || Date.now() < r.timerEnd) return;
  if(ticking) return;
  const p = r.players[r.current];
  if(!p || p.status !== 'wait') return;
  ticking = true;
  try{
    finalizePlayer(r);
    Store._broadcast();
  }finally{ ticking = false; }
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const view = document.getElementById('view');
  const active = document.activeElement;
  const fid = (active && active.id) ? active.id : null;
  const caret = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;

  let html = '';
  if(!app.room){
    if(app.screen === 'create') html = viewCreate();
    else if(app.screen === 'join') html = viewJoin();
    else html = viewHome();
  }else{
    html = viewRoom();
  }

  view.innerHTML = html;
  updateHeader();

  if(fid){
    const el = document.getElementById(fid);
    if(el){
      try{ el.focus(); if(caret !== null && el.setSelectionRange) el.setSelectionRange(caret, caret); }catch(e){}
    }
  }
  updateTimerUI();
}

function updateHeader(){
  const h = document.getElementById('hdr');
  const soundBtn = '<button class="icon-btn" data-act="toggleSound" aria-label="sound">' + (app.sound ? '🔊' : '🔇') + '</button>';
  if(app.room){
    h.innerHTML =
      '<div class="hdr-row">' +
        '<button class="icon-btn" data-act="leave" aria-label="leave">←</button>' +
        '<div class="hdr-title">⚽ ' + esc(app.room.name) + '</div>' +
        '<div class="hdr-code">' + esc(app.room.code) + '</div>' + soundBtn +
      '</div>';
  }else{
    h.innerHTML = '<div class="hdr-row"><div class="hdr-title">⚽ Latency Auction</div>' + soundBtn + '</div>';
  }
}

/* ---------- room router ---------- */
function viewRoom(){
  const r = app.room;
  const me = r.members[app.uid];
  if(!me || me.status === 'kicked'){
    return '<div class="card center"><span class="big-emoji">🚪</span><h2 style="margin:0 0 6px">You are out</h2><p class="muted">The host removed you from this room.</p><button class="btn primary mt" data-act="leave">Back home</button></div>';
  }
  if(me.status === 'pending') return viewPending(r);
  if(r.status === 'lobby') return viewLobby(r, me);
  if(r.status === 'finished') return viewFinished(r);
  return viewAuction(r, me);
}

function viewPending(r){

    });

  h += '<div class="card"><div class="card-h">👥 In the room <span class="pill">' + approved.length + '</span></div>';

function viewAuction(r, me){
  const isHost = app.isHost;
  const p = r.players[r.current];
  if(!p) return '<div class="card center"><span class="big-emoji">⚽</span><h2>No players</h2><p class="muted">Host needs to add players.</p></div>';

  const done = p.status !== 'wait';
  const nextBid = r.bid ? r.bid + r.increment : p.base;
  const total = r.players.length;
  const finishedCount = r.players.filter(x => x.status !== 'wait').length;
  const spent = (r.results[app.uid] && r.results[app.uid].spent) || 0;
  const remaining = r.budget > 0 ? r.budget - spent : Infinity;
  const budgetBlocked = r.budget > 0 && nextBid > remaining;
  const isHighest = r.highBidder === app.uid;
  const canBid = me.status === 'approved' && me.role !== 'observer' && !done && r.status === 'auction';
  const isBump = r.bid !== app.lastBid;
  if(isBump) app.lastBid = r.bid;

  const teams = Object.values(r.members)
    .filter(m => m.status === 'approved' && m.role !== 'observer')
    .map(m => {
      const res = r.results[m.id] || { spent: 0, players: [] };
      return { id: m.id, name: m.name, spent: res.spent || 0, count: (res.players || []).length };
    });

  let h = '';
  h += '<div class="card">' +
    '<div class="ap-top"><span class="pill">#' + (r.current + 1) + ' of ' + total + '</span>' +
    '<span class="pill timer-pill" id="timer-pill">⏱ <span id="timer-secs">' + Math.max(0, Math.ceil((r.timerEnd - Date.now()) / 1000)) + '</span>s</span></div>' +
    '<div class="player-name">' + esc(p.name) + '</div><div class="pos-tag">Base price ' + fmt(p.base) + '</div>' +
    '<div class="bid-row">' +
      '<div class="bid-col"><div class="k">Base</div><div class="v">' + fmt(p.base) + '</div></div>' +
      '<div class="bid-col"><div class="k">Current bid</div><div class="cur-bid ' + (isBump ? 'bump' : '') + '">' + fmt(r.bid || p.base) + '</div></div>' +
      '<div class="bid-col"><div class="k">Highest</div><div class="v">' + (r.highBidderName ? esc(r.highBidderName) : '—') + '</div></div>' +
    '</div>' +
    '<div class="timer-track"><div id="timer-bar" style="width:100%"></div></div>' +
    '<div class="muted center small mt">' + finishedCount + '/' + total + ' players done</div></div>';

  if(done){
    h += '<div class="result ' + (p.status === 'sold' ? 'ok' : 'no') + '">' +
      '<div class="res-title">' + (p.status === 'sold' ? '🎉 SOLD!' : '😢 UNSOLD') + '</div>' +
      '<div class="res-sub ' + (p.status === 'sold' ? '' : 'no') + '">' +
        (p.status === 'sold' ? esc(p.name) + ' → ' + esc(p.soldToName) + ' for ' + fmt(p.price) : esc(p.name) + ' got no bids') + '</div></div>';
    h += isHost
      ? '<button class="btn primary big" data-act="next">Next Player ➜</button>'
      : '<div class="card center"><div class="waiting"><span class="dotb"></span> Waiting for host…</div></div>';
  }else{
    if(canBid){
      h += '<button class="bid-btn" data-act="bid"' + ((budgetBlocked || isHighest) ? ' disabled' : '') + '>' +
        (isHighest ? '👑 You are highest' : (budgetBlocked ? '💸 Out of budget' : 'BID ' + fmt(nextBid))) + '</button>' +
        '<div class="muted center small mt">' + (r.budget > 0 ? 'Your budget left: ' + fmt(remaining) : 'Unlimited budget') + '</div>';
    }else{
      h += '<div class="card center"><div class="waiting"><span class="dotb"></span> ' +
        (me.role === 'observer' ? 'Watching live…' : 'Wait for the host…') + '</div></div>';
    }
    if(isHost){
      h += '<div class="row gap mt"><button class="btn ghost sm" data-act="forceSold">🔨 Sold now</button>' +
        '<button class="btn ghost sm" data-act="forceUnsold">✕ Unsold</button></div>';
    }
  }

  h += '<div class="card"><div class="card-h">🏟️ Teams</div><div class="teams">';
  if(teams.length === 0){ h += '<div class="muted small">No bidders yet</div>'; }
  else{
    teams.forEach(t => {
      h += '<div class="team"><div class="tn">' + esc(t.name) + (t.id === app.uid ? ' (you)' : '') + '</div>' +
        '<div class="tsp">' + fmt(t.spent) + '</div>' +
        '<div class="ts">' + t.count + ' player' + (t.count === 1 ? '' : 's') + (r.budget > 0 ? ' / ' + fmt(r.budget) : '') + '</div></div>';
    });
  }
  h += '</div></div>';

  h += '<div class="card"><div class="card-h">📣 Live feed</div><div class="log">';
  const log = (r.log || []).slice(0, 10);
  if(log.length === 0) h += '<div class="muted small">Nothing yet…</div>';
  else log.forEach(l => { h += '<div class="log-item">' + esc(l.text) + '</div>'; });
  h += '</div></div>';
  return h;
}

function viewFinished(r){
  const isHost = app.isHost;
  const medals = ['🥇','🥈','🥉'];
  const entries = Object.values(r.members)
    .filter(m => m.status === 'approved' && m.role !== 'observer')
    .map(m => {
      const res = r.results[m.id] || { spent: 0, players: [] };
      return { id: m.id, name: m.name, spent: res.spent || 0, players: res.players || [] };
    })
    .sort((a, b) => b.players.length - a.players.length || b.spent - a.spent);
  const unsold = r.players.filter(p => p.status === 'unsold');

  let h = '<div class="card center" style="background:linear-gradient(180deg,#ffffff,#eafff2)">' +
    '<span class="big-emoji">🏆</span><h2 style="margin:0 0 4px">Auction Complete!</h2>' +
    '<p class="muted" style="margin:0">' + esc(r.name) + '</p></div>';

  entries.forEach((t, i) => {
    h += '<div class="card"><div class="card-h"><span>' + (medals[i] || '⚽') + '</span>' +
      '<span style="flex:1">' + esc(t.name) + (t.id === app.uid ? ' (you)' : '') + '</span>' +
      '<span class="pill">' + fmt(t.spent) + '</span></div>';
    if(t.players.length === 0){ h += '<div class="muted small">No players bought 😬</div>'; }
    else{
      t.players.forEach(p => {
        h += '<div class="prow" style="margin-bottom:6px"><span style="font-size:14px">⚽</span><span class="pname">' + esc(p.name) + '</span><span class="pbase">' + fmt(p.price) + '</span></div>';
      });
    }
    h += '</div>';
  });

  if(unsold.length){
    h += '<div class="card"><div class="card-h">😢 Unsold</div><div class="muted">' + unsold.map(p => esc(p.name)).join(' · ') + '</div></div>';
  }

  h += isHost
    ? '<button class="btn primary big" data-act="restart">🔁 New Round</button>'
    : '<div class="card center"><div class="waiting"><span class="dotb"></span> Waiting for host…</div></div>';
  return h;
}

/* ============================================================
   ACTIONS
   ============================================================ */
const ACTIONS = {
  toggleSound(){
    app.sound = !app.sound;
    try{ localStorage.setItem(LS_SOUND, app.sound ? '1' : '0'); }catch(e){}
    if(app.sound) SFX.click();
    render();
  },

  goCreate(){
    if(!String(app.name || '').trim()){ SFX.error(); toast('Enter your name first 😊'); document.getElementById('inp-name')?.focus(); return; }
    SFX.click(); app.screen = 'create'; render();
  },

  goJoin(){
    if(!String(app.name || '').trim()){ SFX.error(); toast('Enter your name first 😊'); document.getElementById('inp-name')?.focus(); return; }
    SFX.click(); app.screen = 'join'; render();
  },

  backHome(){ SFX.click(); app.screen = 'home'; render(); },

  async createRoom(){
    if(!String(app.name || '').trim()){ SFX.error(); toast('Enter your name 😊'); return; }
    try{ localStorage.setItem(LS_NAME, app.name.trim()); }catch(e){}

    const code = genCode();
    const room = newRoom({
      code, name: (String(app.roomName || '').trim() || 'Sunday Auction'),
      hostId: app.uid, hostName: app.name.trim(),
      increment: app.increment, budget: app.budget, timer: app.timer
    });
    room.members[app.uid] = { id: app.uid, name: app.name.trim(), role: 'host', status: 'approved', joinedAt: Date.now() };

    SFX.whistle();
    const mode = await enterRoom(code, true, room);
    toast(mode === 'p2p'
      ? 'Room created! Share the code 🎉'
      : 'Room created (local mode) — P2P unavailable');
  },

  async joinRoom(){
    const code = String(app.joinCode || '').trim().toUpperCase();
    if(code.length < 5){ SFX.error(); toast('Enter a 5-letter room code'); return; }
    if(!String(app.name || '').trim()){ SFX.error(); toast('Enter your name 😊'); return; }
    try{ localStorage.setItem(LS_NAME, app.name.trim()); }catch(e){}

    const wantedRole = app.joinRole === 'observer' ? 'observer' : 'bidder';

    /* optimistic placeholder room so UI shows something */
    const tempRoom = {
      code, name: 'Joining…', hostId: 'host', hostName: '',
      status: 'lobby', members: {}, players: [], current: -1,
      bid: 0, highBidder: null, highBidderName: '', timerEnd: 0,
      results: {}, log: [], round: 1, increment: 1, budget: 100, timer: 15
    };
    tempRoom.members[app.uid] = {
      id: app.uid, name: app.name.trim(), role: wantedRole,
      status: wantedRole === 'observer' ? 'pending' : 'approved'
    };

    SFX.join();
    const mode = await enterRoom(code, false, tempRoom);

    /* send join action after connecting */
    setTimeout(() => {
      Store.sendAction({ type:'join', uid: app.uid, name: app.name.trim(), role: wantedRole });
    }, 500);

    toast(mode === 'p2p' ? 'Joining…' : 'Local mode — cannot reach host');
  },

  addPlayer(){
    if(!app.isHost) return;
    const name = String(app.draft.name || '').trim();
    if(!name){ SFX.error(); toast('Player name?'); document.getElementById('inp-pname')?.focus(); return; }
    const base = Math.max(1, parseInt(app.draft.base, 10) || 10);
    const host = Store._hostData;
    if(!host || host.status !== 'lobby') return;
    host.players.push({ id: rnd(), name, base, status: 'wait', soldTo: null, soldToName: '', price: 0 });
    Store._broadcast();
    app.draft.name = '';
    SFX.click();
    setTimeout(() => { document.getElementById('inp-pname')?.focus(); }, 80);
  },

  delPlayer(el, val){
    if(!app.isHost) return;
    const host = Store._hostData;
    if(!host || host.status !== 'lobby') return;
    host.players = host.players.filter(p => p.id !== val);
    Store._broadcast();
    SFX.click();
  },

  approve(el, val){
    if(!app.isHost) return;
    const host = Store._hostData;
    const m = host.members[val];
    if(m && m.status === 'pending'){ m.status = 'approved'; Store._broadcast(); }
    SFX.join(); toast('Approved 👍');
  },

  kick(el, val){
    if(!app.isHost) return;
    if(!confirm('Remove this person from the room?')) return;
    const host = Store._hostData;
    const m = host.members[val];
    if(m && m.id !== host.hostId){ m.status = 'kicked'; Store._broadcast(); }
    SFX.kick(); toast('Removed 👋');
  },

  start(){
    if(!app.isHost) return;
    const host = Store._hostData;
    if(!host) return;
    if(host.players.length === 0){ SFX.error(); toast('Add players first'); return; }
    SFX.whistle();
    host.status = 'auction';
    host.current = -1;
    host.results = {};
    host.log = [];
    host.bid = 0;
    host.highBidder = null;
    host.highBidderName = '';
    host.players.forEach(p => { p.status = 'wait'; p.soldTo = null; p.soldToName = ''; p.price = 0; });
    nextPlayer(host);
    Store._broadcast();
  },

  bid(){
    if(!app.room || app.room.status !== 'auction') return;
    Store.sendAction({ type:'bid', uid: app.uid });
    SFX.bid();
  },

  forceSold(){
    if(!app.isHost) return;
    const host = Store._hostData;
    if(!host.highBidder){ SFX.error(); toast('No bids yet — cannot sell'); return; }
    finalizePlayer(host);
    Store._broadcast();
    SFX.click();
  },

  forceUnsold(){
    if(!app.isHost) return;
    const host = Store._hostData;
    const p = host.players[host.current];
    if(!p || p.status !== 'wait') return;
    host.highBidder = null; host.highBidderName = ''; host.bid = 0;
    finalizePlayer(host);
    Store._broadcast();
    SFX.click();
  },

  next(){
    if(!app.isHost) return;
    const host = Store._hostData;
    const p = host.players[host.current];
    if(p && p.status === 'wait') return;
    nextPlayer(host);
    Store._broadcast();
    SFX.click();
  },

  restart(){
    if(!app.isHost) return;
    if(!confirm('Start a new round with the same players?')) return;
    SFX.whistle();
    const host = Store._hostData;
    host.status = 'lobby'; host.current = -1; host.bid = 0;
    host.highBidder = null; host.highBidderName = ''; host.timerEnd = 0;
    host.results = {}; host.log = []; host.round = (host.round || 1) + 1;
    host.players.forEach(p => { p.status = 'wait'; p.soldTo = null; p.soldToName = ''; p.price = 0; });
    Store._broadcast();
  },

  copy(){
    SFX.click();
    const code = app.room ? app.room.code : '';
    const text = 'Join my football auction on LATENCY AUCTION! Room code: ' + code + '\n' + roomLink(code);
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => toast('Copied! 📋')).catch(() => toast('Code: ' + code));
    }else{ toast('Code: ' + code); }
  },

  whatsapp(){
    SFX.click();
    if(!app.room) return;
    const text = '⚽ *LATENCY AUCTION* ⚽\nJoin my room "' + app.room.name + '"\nRoom code: *' + app.room.code + '*\n' + roomLink(app.room.code);
    window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank');
  },

  qr(){ SFX.click(); app.showQR = !app.showQR; render(); },

  leave(){
    SFX.click();
    Store.destroy();
    app.room = null; app.code = null; app.isHost = false;
    app.screen = 'home'; app.showQR = false; prevRoom = null;
    try{ history.replaceState(null, '', location.pathname); }catch(e){}
    try{ localStorage.removeItem(LS_LAST); }catch(e){}
    render();
  }
};

/* ============================================================
   EVENTS + BOOT
   ============================================================ */
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-act]');
  if(!btn) return;
  const act = btn.dataset.act;
  if(ACTIONS[act]){ unlockAudio(); try{ ACTIONS[act](btn, btn.dataset.val); }catch(err){ console.error(err); toast('Oops: ' + err.message); } }
});

function onFieldInput(e){
  const el = e.target;
  if(!el || !el.dataset || !el.dataset.model) return;
  let val = el.value;
  if(el.dataset.model === 'joinCode') val = String(val || '').toUpperCase();
  setModel(el.dataset.model, val);
}
document.addEventListener('input', onFieldInput);
document.addEventListener('change', onFieldInput);

document.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  const el = e.target; if(!el || !el.id) return;
  if(el.id === 'inp-pname' || el.id === 'inp-pbase'){ e.preventDefault(); ACTIONS.addPlayer(); }
  if(el.id === 'inp-code' || el.id === 'inp-name2'){ e.preventDefault(); ACTIONS.joinRoom(); }
});

setInterval(() => { updateTimerUI(); hostTick(); }, 300);

/* boot */
(async function boot(){
  let uid = '';
  try{ uid = localStorage.getItem(LS_UID) || ''; }catch(e){}
  if(!uid){ uid = rnd() + rnd(); try{ localStorage.setItem(LS_UID, uid); }catch(e){} }
  app.uid = uid;
  try{
    app.name = localStorage.getItem(LS_NAME) || '';
    app.sound = localStorage.getItem(LS_SOUND) !== '0';
  }catch(e){}
  buildDeco();

  let code = '';
  try{ const p = new URLSearchParams(location.search); code = (p.get('room') || '').trim().toUpperCase(); }catch(e){}

  if(code && code.length >= 4){
    if(!String(app.name || '').trim()){
      app.screen = 'join'; app.joinCode = code; render(); toast('Enter your name to join ' + code);
    }else{
      app.screen = 'join'; app.joinCode = code; render();
    }
  }else{
    render();
  }
})();
</script>
